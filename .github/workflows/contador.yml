# Publica o contador de pessoas online (pasta contador/) na Cloudflare e grava o endereço em contador.json,
# que o site lê. Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (passo a passo no README);
# sem eles, só avisa e termina. Roda quando o contador muda ou manualmente em Actions > Run workflow.
name: Publicar contador de pessoas online

on:
  push:
    paths:
      - contador/**
      - .github/workflows/contador.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confere as chaves da Cloudflare
        id: chaves
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Contador não publicado: cadastre os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (veja o README) e rode este workflow de novo."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chaves.outputs.ok == '1'

      - uses: actions/setup-node@v4
        if: steps.chaves.outputs.ok == '1'
        with:
          node-version: 22

      - name: Publica o Worker
        if: steps.chaves.outputs.ok == '1'
        working-directory: contador
        shell: bash   # com pipefail: se o wrangler falhar, o passo falha
        run: npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.txt"

      - name: Grava o endereço em contador.json
        if: steps.chaves.outputs.ok == '1'
        run: |
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.txt" | head -1)
          if [ -z "$url" ]; then
            echo "::error::Não achei o endereço do Worker na saída do wrangler. Abra Workers & Pages no painel da Cloudflare uma vez para criar o subdomínio workers.dev e rode de novo."
            exit 1
          fi
          printf '{"url": "%s"}\n' "$url" > contador.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contador.json
          if git diff --cached --quiet; then
            echo "contador.json já aponta para $url"
          else
            git commit -m "Contador: endereço do Worker ($url)"
            git pull --rebase --quiet
            git push
          fi
          echo "::notice::Contador publicado em $url"
